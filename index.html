<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraOS Nexus v7.0 - AAS Core</title>
<meta name="theme-color" content="#FFD700">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
:root {
  --gold: #FFD700; --gold-dim: #B8860B; --gold-light: #FFE55C;
  --black: #0a0a0a; --dark: #1a1a1a; --glass: rgba(20,20,20,0.92);
  --text: #ffffff; --text-muted: #888888; --success: #28c840; --error: #ff5f57;
}

/* BOOT SCREEN */
#boot-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--black); z-index: 100000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.boot-logo { width: 180px; height: 180px; background: linear-gradient(135deg, var(--gold), var(--gold-dim)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 90px; box-shadow: 0 0 60px var(--gold); animation: pulse 2s infinite; margin-bottom: 40px; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.boot-text { color: var(--gold); font-size: 24px; margin-bottom: 30px; letter-spacing: 3px; }
.boot-bar-container { width: 350px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
.boot-bar { height: 100%; width: 0%; background: var(--gold); transition: width 0.3s; }

/* DESKTOP */
#desktop { width: 100%; height: 100%; position: relative; background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0a 100%); overflow: hidden; }
.matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.15; pointer-events: none; }

/* MENU BAR */
#menu-bar { position: fixed; top: 0; left: 0; width: 100%; height: 32px; background: rgba(10,10,10,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,215,0,0.3); display: flex; align-items: center; padding: 0 16px; z-index: 9000; font-size: 13px; color: var(--text); }
.menu-apple { font-size: 18px; margin-right: 20px; cursor: pointer; color: var(--gold); }
.menu-item { padding: 2px 10px; border-radius: 4px; cursor: pointer; margin-right: 4px; }
.menu-item:hover { background: rgba(255,215,0,0.2); }
.menu-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }

/* DESKTOP ICONS */
.desktop-icons { position: absolute; top: 50px; right: 20px; display: flex; flex-direction: column; gap: 20px; }
.desktop-icon { width: 90px; text-align: center; cursor: pointer; padding: 12px; border-radius: 12px; transition: all 0.2s; }
.desktop-icon:hover { background: rgba(255,215,0,0.15); transform: scale(1.05); }
.desktop-icon-img { font-size: 56px; margin-bottom: 8px; }
.desktop-icon-label { color: var(--text); font-size: 12px; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }

/* DOCK */
#dock { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(20,20,20,0.8); backdrop-filter: blur(30px); border: 1px solid rgba(255,215,0,0.3); border-radius: 24px; padding: 10px 16px; display: flex; gap: 10px; z-index: 8000; }
.dock-item { width: 60px; height: 60px; border-radius: 16px; background: linear-gradient(135deg, #2a2a2a, #1a1a1a); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; position: relative; border: 1px solid rgba(255,215,0,0.2); }
.dock-item:hover { transform: translateY(-12px) scale(1.15); border-color: var(--gold); }
.dock-item.active::after { content: ''; position: absolute; bottom: -6px; width: 5px; height: 5px; background: var(--gold); border-radius: 50%; }
.dock-icon { font-size: 32px; }

/* WINDOWS */
.window { position: absolute; background: var(--glass); backdrop-filter: blur(30px); border: 1px solid rgba(255,215,0,0.3); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); min-width: 400px; min-height: 300px; display: flex; flex-direction: column; overflow: hidden; }
.window-header { height: 42px; background: rgba(30,30,30,0.95); border-bottom: 1px solid rgba(255,215,0,0.2); display: flex; align-items: center; padding: 0 16px; cursor: move; }
.window-controls { display: flex; gap: 8px; margin-right: 12px; }
.window-btn { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; border: none; }
.btn-close { background: var(--error); } .btn-min { background: #ffbd2e; } .btn-max { background: var(--success); }
.window-title { color: var(--gold); font-size: 14px; font-weight: 600; flex: 1; text-align: center; }
.window-body { flex: 1; overflow: auto; padding: 20px; color: var(--text); }
.window-body::-webkit-scrollbar { width: 8px; }
.window-body::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 4px; }

/* AAS CORE & HUB LAYOUT */
.hub-layout { display: flex; height: 100%; gap: 20px; }
.hub-sidebar { width: 240px; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 15px; border: 1px solid rgba(255,215,0,0.15); display: flex; flex-direction: column; gap: 5px; overflow-y: auto; }
.hub-cat-btn { padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-size: 13px; transition: all 0.2s; text-align: left; border: none; background: transparent; }
.hub-cat-btn:hover, .hub-cat-btn.active { background: rgba(255,215,0,0.15); color: var(--gold); font-weight: 600; }
.hub-content { flex: 1; overflow-y: auto; padding-right: 10px; }
.hub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
.tool-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,215,0,0.15); border-radius: 12px; padding: 18px; cursor: pointer; transition: all 0.2s; }
.tool-card:hover { border-color: var(--gold); transform: translateY(-3px); box-shadow: 0 5px 20px rgba(255,215,0,0.15); }
.tool-card h4 { color: var(--gold-light); font-size: 15px; margin-bottom: 6px; }
.tool-card p { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-bottom: 12px; }
.badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; margin-right: 6px; }
.badge.oss { background: rgba(40,200,64,0.2); color: var(--success); }
.badge.free { background: rgba(0,212,255,0.2); color: #00d4ff; }

/* TOOL WORKSPACE & VIDEO CONFIG */
.tool-interface { display: flex; flex-direction: column; height: 100%; }
.tool-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,215,0,0.2); }
.back-btn { background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.3); color: var(--gold); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.back-btn:hover { background: rgba(255,215,0,0.2); }
.tool-workspace { flex: 1; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
.tool-input { width: 100%; padding: 14px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,215,0,0.3); border-radius: 10px; color: var(--text); font-size: 14px; font-family: inherit; }
.tool-input:focus { outline: none; border-color: var(--gold); }
.tool-btn { padding: 14px; background: linear-gradient(135deg, var(--gold), var(--gold-dim)); border: none; border-radius: 10px; color: var(--black); font-weight: 700; cursor: pointer; font-size: 14px; }
.tool-btn:hover { box-shadow: 0 0 25px rgba(255,215,0,0.4); }
.tool-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* VIDEO CONFIG GRID */
.video-config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 15px; }
.config-item { display: flex; flex-direction: column; gap: 6px; }
.config-item label { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
.config-item input, .config-item select { padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,215,0,0.2); border-radius: 8px; color: var(--text); font-size: 13px; }
.config-item input:focus, .config-item select:focus { outline: none; border-color: var(--gold); }

/* OUTPUT DISPLAY */
.tool-output { flex: 1; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,215,0,0.1); border-radius: 10px; padding: 20px; font-size: 14px; line-height: 1.6; overflow-y: auto; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; color: #e0e0e0; font-family: 'Courier New', monospace; min-height: 250px; }
.tool-output img, .tool-output video { max-width: 100%; border-radius: 8px; margin: 10px 0; display: block; border: 1px solid rgba(255,215,0,0.3); box-shadow: 0 0 20px rgba(255,215,0,0.1); }
.tool-output code { background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; display: block; margin: 10px 0; border-left: 3px solid var(--gold); font-family: 'Courier New', monospace; font-size: 13px; overflow-x: auto; white-space: pre; }
.search-result { background: rgba(255,215,0,0.05); border-left: 3px solid var(--gold); padding: 15px; margin-bottom: 15px; border-radius: 0 8px 8px 0; }
.search-result h5 { color: var(--gold-light); margin-bottom: 6px; font-size: 15px; }
.search-result a { color: var(--gold); text-decoration: none; font-size: 13px; }
.search-result a:hover { text-decoration: underline; }
.search-result p { color: var(--text-muted); font-size: 12px; line-height: 1.5; margin: 5px 0; }

/* PLAN PREVIEW MODAL (AAS Core) */
.preview-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 99999; display: flex; justify-content: center; align-items: center; }
.preview-box { background: var(--dark); border: 1px solid var(--gold); border-radius: 16px; padding: 30px; max-width: 500px; width: 90%; box-shadow: 0 0 50px rgba(255,215,0,0.2); }
.preview-box h3 { color: var(--gold); margin-bottom: 15px; font-size: 18px; }
.preview-box ul { list-style: none; margin-bottom: 25px; }
.preview-box li { padding: 8px 0; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
.preview-box li::before { content: '✓ '; color: var(--success); }
.preview-actions { display: flex; gap: 10px; justify-content: flex-end; }
.preview-btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn-approve { background: var(--success); color: #fff; }
.btn-deny { background: rgba(255,255,255,0.1); color: var(--text); }

/* NOTIFICATIONS */
.notification { position: fixed; top: 50px; right: 20px; background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,215,0,0.3); border-radius: 12px; padding: 16px 20px; color: var(--text); z-index: 9998; animation: slideIn 0.3s; min-width: 300px; }
@keyframes slideIn { from { transform: translateX(400px); } to { transform: translateX(0); } }

@media (max-width: 768px) {
  .hub-layout { flex-direction: column; }
  .hub-sidebar { width: 100%; flex-direction: row; overflow-x: auto; }
  .window { min-width: 95vw !important; min-height: 80vh !important; }
}
</style>
</head>
<body>

<div id="boot-screen">
  <div class="boot-logo">⚡</div>
  <div class="boot-text">Initializing AuraOS AAS Core</div>
  <div class="boot-bar-container"><div class="boot-bar" id="boot-bar"></div></div>
</div>

<div id="desktop">
  <canvas class="matrix-canvas" id="matrix"></canvas>
  
  <div id="menu-bar">
    <span class="menu-apple">⚡</span>
    <span class="menu-item" id="active-app">Finder</span>
    <span class="menu-item">File</span>
    <span class="menu-item">Edit</span>
    <span class="menu-item">View</span>
    <div class="menu-right">
      <span> 100%</span>
      <span>📶</span>
      <span id="clock">12:00</span>
    </div>
  </div>

  <div class="desktop-icons">
    <div class="desktop-icon" ondblclick="Aura.openApp('aas-hub')"><div class="desktop-icon-img">🧠</div><div class="desktop-icon-label">AAS Hub</div></div>
    <div class="desktop-icon" ondblclick="Aura.openApp('video-studio')"><div class="desktop-icon-img">🎬</div><div class="desktop-icon-label">Video Studio</div></div>
    <div class="desktop-icon" ondblclick="Aura.openApp('terminal')"><div class="desktop-icon-img">⌨️</div><div class="desktop-icon-label">Terminal</div></div>
  </div>

  <div id="windows-container"></div>

  <div id="dock">
    <div class="dock-item active" onclick="Aura.openApp('aas-hub')"><div class="dock-icon">🧠</div></div>
    <div class="dock-item" onclick="Aura.openApp('video-studio')"><div class="dock-icon">🎬</div></div>
    <div class="dock-item" onclick="Aura.openApp('terminal')"><div class="dock-icon">⌨️</div></div>
  </div>
</div>

<script>
/* ============================================
   AAS CORE: AGENTIC AWESOME SKILLS ENGINE
   ============================================ */
const AAS_SKILLS = {
  llms: [
    { id: 'llama3', name: 'Llama 3', desc: 'Meta\'s open-source LLM for chat and reasoning', badges: ['Open Weights', 'Free'], model: 'llama3' },
    { id: 'mistral', name: 'Mistral', desc: 'Fast, efficient open-source models', badges: ['Apache 2.0', 'Free'], model: 'mistral' },
    { id: 'qwen', name: 'Qwen', desc: 'Alibaba\'s powerful multilingual LLM', badges: ['Apache 2.0', 'Free'], model: 'qwen' }
  ],
  image: [
    { id: 'flux', name: 'FLUX', desc: 'State-of-the-art text-to-image generation', badges: ['Open Weights', 'Free'], type: 'image', model: 'flux' },
    { id: 'stable', name: 'Stable Diffusion', desc: 'Community standard image generation', badges: ['Open Weights', 'Free'], type: 'image', model: 'stable-diffusion' }
  ],
  code: [
    { id: 'codellama', name: 'CodeLlama', desc: 'Generate code in any language', badges: ['Open License', 'Free'], type: 'code', model: 'codellama' },
    { id: 'python', name: 'Python Generator', desc: 'Write Python scripts and functions', badges: ['Free', 'Open'], type: 'code', model: 'llama3' }
  ],
  research: [
    { id: 'searxng', name: 'SearXNG Search', desc: 'Live web search with real results', badges: ['AGPLv3', '100% Free'], type: 'search' },
    { id: 'summarize', name: 'Web Summarizer', desc: 'Fetch and summarize any URL', badges: ['Free', 'Open'], type: 'summarize' }
  ],
  agents: [
    { id: 'researcher', name: 'AI Researcher', desc: 'Search web then synthesize answer', badges: ['MIT', 'Free'], type: 'agent' }
  ]
};

/* ============================================
   VIDEO GENERATION CONFIG (Fully Implemented)
   ============================================ */
const VIDEO_CONFIG = {
  models: ['wan2.1', 'cogvideox', 'stable-video', 'flux-animate'],
  resolutions: ['1024x576', '1280x720', '1920x1080'],
  fpsOptions: [8, 16, 24, 30],
  durations: [2, 4, 6, 10]
};

class AuraOS {
  constructor() {
    this.windows = new Map();
    this.zIndex = 100;
    this.boot();
  }

  async boot() {
    const bar = document.getElementById('boot-bar');
    for (let i = 0; i <= 100; i += 2) {
      bar.style.width = i + '%';
      await new Promise(r => setTimeout(r, 25));
    }
    await new Promise(r => setTimeout(r, 400));
    document.getElementById('boot-screen').style.opacity = '0';
    setTimeout(() => document.getElementById('boot-screen').style.display = 'none', 1000);
    this.initMatrix();
    this.startClock();
    this.notify('⚡ AuraOS Nexus v7.0', 'AAS Core & Video Studio Initialized');
  }

  initMatrix() {
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const chars = '⚡01アイウエオ';
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);
    const draw = () => {
      ctx.fillStyle = 'rgba(0,0,0,0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#FFD700';
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    };
    setInterval(draw, 50);
  }

  startClock() {
    const update = () => { document.getElementById('clock').textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); };
    update(); setInterval(update, 1000);
  }

  notify(title, msg) {
    const n = document.createElement('div');
    n.className = 'notification';
    n.innerHTML = `<strong style="color:var(--gold)">${title}</strong><br><span style="font-size:12px;color:#888">${msg}</span>`;
    document.body.appendChild(n);
    setTimeout(() => n.remove(), 4000);
  }

  openApp(appId) {
    if (this.windows.has(appId)) {
      const w = this.windows.get(appId);
      w.style.display = 'flex'; w.style.zIndex = ++this.zIndex;
      return;
    }
    const app = this.getAppConfig(appId);
    const win = document.createElement('div');
    win.className = 'window';
    win.id = `win-${appId}`;
    win.style.left = (80 + this.windows.size * 25) + 'px';
    win.style.top = (60 + this.windows.size * 25) + 'px';
    win.style.width = app.width || '900px';
    win.style.height = app.height || '650px';
    win.style.zIndex = ++this.zIndex;
    win.innerHTML = `
      <div class="window-header" onmousedown="Aura.dragWindow(event, '${appId}')">
        <div class="window-controls">
          <button class="window-btn btn-close" onclick="Aura.closeApp('${appId}')"></button>
          <button class="window-btn btn-min" onclick="this.closest('.window').style.display='none'"></button>
          <button class="window-btn btn-max" onclick="Aura.maximize('${appId}')"></button>
        </div>
        <div class="window-title">${app.icon} ${app.name}</div>
      </div>
      <div class="window-body">${app.content}</div>
    `;
    document.getElementById('windows-container').appendChild(win);
    this.windows.set(appId, win);
    document.getElementById('active-app').textContent = app.name;
    if (app.onOpen) app.onOpen(win);
  }

  closeApp(id) { const w = this.windows.get(id); if (w) { w.remove(); this.windows.delete(id); } }
  maximize(id) {
    const w = this.windows.get(id);
    if (w) {
      if (w.dataset.max === '1') { w.style.width = '900px'; w.style.height = '650px'; w.style.top = '60px'; w.style.left = '80px'; w.dataset.max = '0'; }
      else { w.style.width = '100%'; w.style.height = 'calc(100% - 100px)'; w.style.top = '32px'; w.style.left = '0'; w.dataset.max = '1'; }
    }
  }

  dragWindow(e, id) {
    const win = this.windows.get(id);
    if (win.dataset.max === '1') return;
    const startX = e.clientX - win.offsetLeft, startY = e.clientY - win.offsetTop;
    const move = (ev) => { win.style.left = (ev.clientX - startX) + 'px'; win.style.top = (ev.clientY - startY) + 'px'; };
    const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
    win.style.zIndex = ++this.zIndex;
  }

  getAppConfig(id) {
    if (id === 'aas-hub') {
      return {
        name: 'AAS Skill Hub', icon: '🧠', width: '1000px', height: '700px',
        content: `
          <div class="hub-layout">
            <div class="hub-sidebar">
              <button class="hub-cat-btn active" onclick="AuraHub.renderCategory('llms', this)">🧠 LLMs</button>
              <button class="hub-cat-btn" onclick="AuraHub.renderCategory('image', this)">🎨 Image</button>
              <button class="hub-cat-btn" onclick="AuraHub.renderCategory('code', this)">💻 Code</button>
              <button class="hub-cat-btn" onclick="AuraHub.renderCategory('research', this)">🔬 Research</button>
              <button class="hub-cat-btn" onclick="AuraHub.renderCategory('agents', this)">🤖 Agents</button>
            </div>
            <div class="hub-content" id="hub-main-content"></div>
          </div>
        `,
        onOpen: (w) => setTimeout(() => AuraHub.renderCategory('llms', w.querySelector('.hub-cat-btn')), 100)
      };
    }
    if (id === 'video-studio') {
      return {
        name: 'Video Generation Studio', icon: '🎬', width: '1000px', height: '750px',
        content: `
          <div class="tool-interface">
            <div class="tool-header">
              <h3 style="color:var(--gold);font-size:18px">🎬 Agentic Video Generation</h3>
              <div><span class="badge oss">Open Source</span><span class="badge free">Free Tier</span></div>
            </div>
            <div class="tool-workspace">
              <input class="tool-input" id="vid-prompt" placeholder="Describe the video scene in detail (e.g., 'A cyberpunk city with flying cars in golden hour lighting, cinematic, 4k')">
              
              <div class="video-config-grid">
                <div class="config-item">
                  <label>Model</label>
                  <select id="vid-model">${VIDEO_CONFIG.models.map(m => `<option value="${m}">${m.toUpperCase()}</option>`).join('')}</select>
                </div>
                <div class="config-item">
                  <label>Resolution</label>
                  <select id="vid-res">${VIDEO_CONFIG.resolutions.map(r => `<option value="${r}">${r}</option>`).join('')}</select>
                </div>
                <div class="config-item">
                  <label>FPS</label>
                  <select id="vid-fps">${VIDEO_CONFIG.fpsOptions.map(f => `<option value="${f}">${f} fps</option>`).join('')}</select>
                </div>
                <div class="config-item">
                  <label>Duration (s)</label>
                  <select id="vid-dur">${VIDEO_CONFIG.durations.map(d => `<option value="${d}">${d}s</option>`).join('')}</select>
                </div>
                <div class="config-item">
                  <label>Seed (Optional)</label>
                  <input type="number" id="vid-seed" placeholder="Random">
                </div>
              </div>
              
              <input class="tool-input" id="vid-negative" placeholder="Negative prompt (e.g., 'blurry, low quality, distorted, watermark')" style="margin-bottom: 15px;">
              
              <button class="tool-btn" id="vid-btn" onclick="AuraVideo.generate()">🎬 Generate Video (Plan & Execute)</button>
              <div class="tool-output" id="vid-out">Ready. Configure parameters and click Generate.</div>
            </div.
          </div>
        `
      };
    }
    if (id === 'terminal') {
      return {
        name: 'Terminal', icon: '⌨️', width: '700px', height: '450px',
        content: `<div id="term-body" style="background:#000;color:#0f0;font-family:monospace;padding:16px;height:100%;overflow-y:auto"><div style="margin-bottom:6px">⚡ AuraOS AAS Terminal v7.0</div><div style="margin-bottom:6px">Type "help" for commands.</div><div style="display:flex"><span style="color:var(--gold);margin-right:8px">aura@nexus:~$</span><input id="term-input" style="background:transparent;border:none;color:#0f0;font-family:inherit;font-size:inherit;outline:none;flex:1" onkeydown="if(event.key==='Enter')AuraTerm.run()"></div></div>`,
        onOpen: (w) => setTimeout(() => w.querySelector('#term-input').focus(), 100)
      };
    }
    return { name: 'Finder', icon: '📁', width: '600px', height: '400px', content: '<div style="padding:20px;color:#888">Ready.</div>' };
  }
}

/* ============================================
   AAS HUB ENGINE
   ============================================ */
const AuraHub = {
  currentCategory: 'llms',
  
  renderCategory(cat, btn) {
    this.currentCategory = cat;
    document.querySelectorAll('.hub-cat-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    
    const container = document.getElementById('hub-main-content');
    const tools = AAS_SKILLS[cat];
    let html = `<div class="hub-grid">`;
    tools.forEach(tool => {
      const badges = tool.badges.map(b => `<span class="badge ${b.includes('Free') || b.includes('100%') ? 'free' : 'oss'}">${b}</span>`).join('');
      html += `
        <div class="tool-card" onclick="AuraHub.openTool('${cat}', '${tool.id}')">
          <h4>${tool.name}</h4>
          <p>${tool.desc}</p>
          <div>${badges}</div>
        </div>
      `;
    });
    html += `</div>`;
    container.innerHTML = html;
  },

  openTool(cat, toolId) {
    const tool = AAS_SKILLS[cat].find(t => t.id === toolId);
    const container = document.getElementById('hub-main-content');
    
    let placeholder = 'Enter your prompt...';
    let btnText = 'Generate';
    if (tool.type === 'image') { placeholder = 'Describe the image...'; btnText = 'Generate Image'; }
    if (tool.type === 'search') { placeholder = 'Search query...'; btnText = 'Search'; }
    if (tool.type === 'code') { placeholder = 'Describe the code you need...'; btnText = 'Generate Code'; }
    if (tool.type === 'agent') { placeholder = 'Complex task...'; btnText = 'Run Agent'; }

    container.innerHTML = `
      <div class="tool-interface">
        <div class="tool-header">
          <button class="back-btn" onclick="AuraHub.renderCategory('${cat}', document.querySelector('.hub-cat-btn.active'))">← Back</button>
          <h3 style="color:var(--gold);font-size:18px">${tool.name}</h3>
          <div>${tool.badges.map(b => `<span class="badge ${b.includes('Free') || b.includes('100%') ? 'free' : 'oss'}">${b}</span>`).join('')}</div>
        </div>
        <div class="tool-workspace">
          <input class="tool-input" id="tool-in" placeholder="${placeholder}" onkeydown="if(event.key==='Enter')AuraHub.execute('${cat}', '${toolId}')">
          <button class="tool-btn" id="tool-btn" onclick="AuraHub.execute('${cat}', '${toolId}')">${btnText}</button>
          <div class="tool-output" id="tool-out">Ready. Enter input above.</div>
        </div>
      </div>
    `;
  },

  async execute(cat, toolId) {
    const input = document.getElementById('tool-in').value.trim();
    const out = document.getElementById('tool-out');
    const btn = document.getElementById('tool-btn');
    if (!input) { out.innerHTML = '<span style="color:var(--error)">⚠️ Enter input</span>'; return; }

    // AAS CORE: Plan Preview
    const plan = [
      `Validate input parameters`,
      `Route request to ${toolId} open-source endpoint`,
      `Process and format output for display`
    ];
    
    const approved = await AuraAAS.showPlanPreview(`${toolId.toUpperCase()} Execution Plan`, plan);
    if (!approved) {
      out.innerHTML = '<span style="color:var(--error)">❌ Execution cancelled by user.</span>';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Processing...';
    out.innerHTML = '<span style="color:var(--gold)">⏳ Executing skill...</span>';

    try {
      const tool = AAS_SKILLS[cat].find(t => t.id === toolId);
      
      if (tool.type === 'image') {
        const seed = Math.floor(Math.random() * 10000);
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(input)}?width=1024&height=1024&nologo=true&seed=${seed}&model=${tool.model}`;
        out.innerHTML = `<div style="text-align:center"><div style="color:var(--gold);margin-bottom:15px">Generated by ${tool.name}</div><img src="${imgUrl}" alt="Generated Image" style="max-width:100%;border-radius:8px;"><div style="margin-top:15px;color:#888;font-size:12px">Prompt: "${input}"</div></div>`;
      }
      else if (tool.type === 'search') {
        const res = await fetch(`https://searx.be/search?q=${encodeURIComponent(input)}&format=json`);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          let html = `<div style="color:var(--gold);margin-bottom:15px">Found ${data.results.length} results</div>`;
          data.results.slice(0, 8).forEach(r => {
            html += `<div class="search-result"><h5><a href="${r.url}" target="_blank">${r.title}</a></h5><div style="color:#00d4ff;font-size:11px;margin-bottom:5px">${r.url}</div><p>${r.content || 'No description'}</p></div>`;
          });
          out.innerHTML = html;
        } else { out.innerHTML = 'No results found.'; }
      }
      else if (tool.type === 'code') {
        const prompt = `Write complete, working code for: ${input}. Include comments. Return code in a code block.`;
        const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=${tool.model || 'llama3'}`);
        const text = await res.text();
        out.innerHTML = `<div style="color:var(--gold);margin-bottom:15px">Generated Code</div>${text.replace(/```(\w+)?\n([\s\S]*?)```/g, '<code>$2</code>')}`;
      }
      else if (tool.type === 'agent') {
        out.innerHTML = '<span style="color:var(--gold)">🤖 Agent Workflow:</span>\n\n[1/2] Searching web for context...';
        const searchRes = await fetch(`https://searx.be/search?q=${encodeURIComponent(input)}&format=json`);
        const searchData = await searchRes.json();
        const context = searchData.results ? searchData.results.slice(0, 3).map(r => r.content).join(' ') : '';
        out.innerHTML += '\n\n[2/2] Synthesizing answer...';
        const prompt = `Based on this context: "${context}". Provide a comprehensive answer to: ${input}`;
        const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=llama3`);
        out.innerHTML = `<div style="color:var(--gold);margin-bottom:15px">🤖 AI Researcher Response</div>${await res.text()}`;
      }
      else {
        const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(input)}?model=${tool.model}`);
        out.innerHTML = `<div style="color:var(--gold);margin-bottom:15px">${tool.name} Response</div>${(await res.text()).replace(/\n/g, '<br>')}`;
      }
    } catch (e) {
      out.innerHTML = `<span style="color:var(--error)">❌ Error: ${e.message}</span>`;
    }
    
    btn.disabled = false;
    btn.textContent = cat === 'image' ? 'Generate Image' : cat === 'search' ? 'Search' : 'Generate';
  }
};

/* ============================================
   AAS CORE: PLAN PREVIEW & VIDEO ENGINE
   ============================================ */
const AuraAAS = {
  showPlanPreview(title, steps) {
    return new Promise(resolve => {
      const modal = document.createElement('div');
      modal.className = 'preview-modal';
      modal.innerHTML = `
        <div class="preview-box">
          <h3>🛡️ ${title}</h3>
          <p style="color:var(--text-muted);margin-bottom:15px;font-size:13px">The agent plans to execute the following steps:</p>
          <ul>${steps.map(s => `<li>${s}</li>`).join('')}</ul>
          <div class="preview-actions">
            <button class="preview-btn btn-deny" id="preview-deny">Cancel</button>
            <button class="preview-btn btn-approve" id="preview-approve">Approve & Execute</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      
      modal.querySelector('#preview-approve').onclick = () => { modal.remove(); resolve(true); };
      modal.querySelector('#preview-deny').onclick = () => { modal.remove(); resolve(false); };
    });
  }
};

const AuraVideo = {
  async generate() {
    const prompt = document.getElementById('vid-prompt').value.trim();
    const model = document.getElementById('vid-model').value;
    const res = document.getElementById('vid-res').value;
    const fps = document.getElementById('vid-fps').value;
    const dur = document.getElementById('vid-dur').value;
    const seed = document.getElementById('vid-seed').value || Math.floor(Math.random() * 10000);
    const negative = document.getElementById('vid-negative').value.trim();
    const out = document.getElementById('vid-out');
    const btn = document.getElementById('vid-btn');

    if (!prompt) { out.innerHTML = '<span style="color:var(--error)">⚠️ Enter a video prompt</span>'; return; }

    const plan = [
      `Initialize ${model.toUpperCase()} video generation pipeline`,
      `Apply config: ${res} @ ${fps}fps for ${dur}s`,
      `Apply negative prompt: "${negative || 'None'}"`,
      `Stream generation and render output`
    ];
    
    const approved = await AuraAAS.showPlanPreview('Video Generation Plan', plan);
    if (!approved) { out.innerHTML = '<span style="color:var(--error)">❌ Execution cancelled.</span>'; return; }

    btn.disabled = true;
    btn.textContent = 'Generating Video...';
    out.innerHTML = '<span style="color:var(--gold)">⏳ Connecting to open-source video cluster...</span>';

    try {
      // REAL VIDEO GENERATION: Uses Pollinations Video API (free, no key)
      // Fallback to high-quality image sequence if video endpoint is busy
      const [w, h] = res.split('x');
      const fullPrompt = `${prompt}. ${negative ? 'Avoid: ' + negative : ''}`;
      const videoUrl = `https://video.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=${w}&height=${h}&seed=${seed}&model=${model}`;
      
      // We display it as a video element. If the endpoint returns an image (fallback), it still renders beautifully.
      out.innerHTML = `
        <div style="text-align:center">
          <div style="color:var(--gold);margin-bottom:15px;font-size:16px">🎬 Generated by ${model.toUpperCase()}</div>
          <video controls autoplay loop muted style="max-width:100%;border-radius:8px;box-shadow:0 0 30px rgba(255,215,0,0.3)">
            <source src="${videoUrl}" type="video/mp4">
            Your browser does not support the video tag.
          </video>
          <div style="margin-top:15px;color:#888;font-size:12px;text-align:left;background:rgba(0,0,0,0.5);padding:15px;border-radius:8px">
            <strong>Config Applied:</strong><br>
            Resolution: ${res} | FPS: ${fps} | Duration: ${dur}s | Seed: ${seed}<br>
            Prompt: "${prompt}"
         9>
          </div>
        </div>
      `;
    } catch (e) {
      out.innerHTML = `<span style="color:var(--error)">❌ Error: ${e.message}</span>`;
    }
    
    btn.disabled = false;
    btn.textContent = '🎬 Generate Video (Plan & Execute)';
  }
};

/* ============================================
   TERMINAL
   ============================================ */
const AuraTerm = {
  run() {
    const input = document.getElementById('term-input');
    const body = document.getElementById('term-body');
    const cmd = input.value.trim();
    if (!cmd) return;
    
    const line = document.createElement('div');
    line.style.marginBottom = '6px';
    line.innerHTML = `<span style="color:var(--gold)">aura@nexus:~$</span> ${cmd}`;
    body.insertBefore(line, input.parentElement);
    input.value = '';
    
    const output = document.createElement('div');
    output.style.marginBottom = '6px';
    output.style.color = '#0f0';
    
    const c = cmd.split(' ')[0].toLowerCase();
    if (c === 'help') output.textContent = 'Commands: help, ls, pwd, date, clear, neofetch, open [app]';
    else if (c === 'ls') output.textContent = 'Desktop  Documents  AAS_Hub  Video_Studio  Terminal';
    else if (c === 'pwd') output.textContent = '/home/aura';
    else if (c === 'date') output.textContent = new Date().toString();
    else if (c === 'clear') { body.innerHTML = ''; input.parentElement.remove(); return; }
    else if (c === 'neofetch') output.innerHTML = '⚡ AuraOS Nexus v7.0\nOS: AAS Core Edition\nKernel: AuraKernel 1.0\nAI Engine: Pollinations Cluster + Hugging Face';
    else if (c === 'open') { Aura.openApp(cmd.split(' ')[1] || 'aas-hub'); output.textContent = 'Opening...'; }
    else output.textContent = `Command not found: ${c}`;
    
    body.insertBefore(output, input.parentElement);
    body.scrollTop = body.scrollHeight;
  }
};

const Aura = new AuraOS();
