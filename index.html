<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AuraOS Nexus</title>
<meta name="theme-color" content="#000000">
<style>
/* ============================================
   AURAOS NEXUS v4.0 - SUPERCOMPUTER DESKTOP
   ============================================ */

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif; }

/* BOOT SEQUENCE */
#boot-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #000; z-index: 100000; display: flex; flex-direction: column;
  justify-content: center; align-items: center; transition: opacity 1s;
}
#boot-screen.fade { opacity: 0; pointer-events: none; }
.boot-logo { font-size: 120px; margin-bottom: 40px; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.05); } }
.boot-bar-container { width: 300px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
.boot-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #00d4ff, #7b2cbf); transition: width 0.3s; }
.boot-text { color: #666; margin-top: 20px; font-size: 14px; letter-spacing: 2px; }

/* DESKTOP */
#desktop {
  width: 100%; height: 100%; position: relative;
  background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
  overflow: hidden;
}
#desktop::before {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: 
    radial-gradient(circle at 20% 30%, rgba(0,212,255,0.1) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(123,44,191,0.1) 0%, transparent 50%);
  pointer-events: none;
}
.matrix-rain { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.05; }

/* MENU BAR */
#menu-bar {
  position: fixed; top: 0; left: 0; width: 100%; height: 28px;
  background: rgba(20,20,30,0.85); backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; padding: 0 15px; z-index: 9000;
  font-size: 13px; color: #fff;
}
.menu-left { display: flex; align-items: center; gap: 18px; }
.menu-right { margin-left: auto; display: flex; align-items: center; gap: 15px; font-size: 12px; }
.menu-item { cursor: pointer; padding: 2px 8px; border-radius: 4px; transition: background 0.2s; }
.menu-item:hover { background: rgba(255,255,255,0.15); }
.menu-app-name { font-weight: 600; }
.menu-icon { font-size: 14px; }

/* DESKTOP ICONS */
.desktop-icons { position: absolute; top: 40px; right: 20px; display: flex; flex-direction: column; gap: 20px; }
.desktop-icon { width: 80px; text-align: center; cursor: pointer; padding: 8px; border-radius: 8px; transition: background 0.2s; }
.desktop-icon:hover { background: rgba(255,255,255,0.1); }
.desktop-icon-img { font-size: 48px; margin-bottom: 5px; }
.desktop-icon-label { color: #fff; font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); word-wrap: break-word; }

/* DOCK */
#dock {
  position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(30,30,45,0.7); backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.15); border-radius: 20px;
  padding: 8px 12px; display: flex; gap: 8px; z-index: 8000;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
.dock-item {
  width: 56px; height: 56px; border-radius: 14px;
  background: linear-gradient(135deg, #2a2a3e, #1a1a2e);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; position: relative;
  border: 1px solid rgba(255,255,255,0.1);
}
.dock-item:hover { transform: translateY(-10px) scale(1.15); background: linear-gradient(135deg, #3a3a5e, #2a2a4e); }
.dock-item.active::after {
  content: ''; position: absolute; bottom: -6px; width: 4px; height: 4px;
  background: #fff; border-radius: 50%;
}
.dock-icon { font-size: 28px; }
.dock-label { font-size: 9px; color: #fff; margin-top: 2px; }
.dock-separator { width: 1px; background: rgba(255,255,255,0.2); margin: 0 4px; }

/* WINDOWS */
.window {
  position: absolute; background: rgba(30,30,45,0.95); backdrop-filter: blur(30px);
  border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7); min-width: 400px; min-height: 300px;
  display: flex; flex-direction: column; overflow: hidden;
  transition: transform 0.2s, opacity 0.2s;
}
.window.minimized { transform: scale(0.1); opacity: 0; pointer-events: none; }
.window.maximized { top: 28px !important; left: 0 !important; width: 100% !important; height: calc(100% - 90px) !important; border-radius: 0; }
.window-header {
  height: 38px; background: rgba(40,40,55,0.9); border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; padding: 0 12px; cursor: move;
}
.window-controls { display: flex; gap: 8px; margin-right: 12px; }
.window-btn { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: none; }
.btn-close { background: #ff5f57; }
.btn-min { background: #ffbd2e; }
.btn-max { background: #28c840; }
.window-btn:hover { filter: brightness(0.8); }
.window-title { color: #fff; font-size: 13px; font-weight: 500; flex: 1; text-align: center; }
.window-body { flex: 1; overflow: auto; padding: 15px; color: #fff; }
.window-body::-webkit-scrollbar { width: 8px; }
.window-body::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
.window-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

/* AI STUDIO */
.ai-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
.ai-card {
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; padding: 15px; transition: all 0.2s;
}
.ai-card:hover { border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,0.2); }
.ai-card h3 { font-size: 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.ai-card p { font-size: 12px; color: #a0a0b0; margin-bottom: 12px; }
.ai-input { width: 100%; padding: 10px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 13px; margin-bottom: 10px; }
.ai-input:focus { outline: none; border-color: #00d4ff; }
.ai-btn { width: 100%; padding: 10px; background: linear-gradient(135deg, #00d4ff, #7b2cbf); border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer; font-size: 13px; }
.ai-btn:hover { opacity: 0.9; }
.ai-output { margin-top: 12px; padding: 12px; background: rgba(0,0,0,0.5); border-radius: 8px; min-height: 80px; font-size: 12px; font-family: monospace; white-space: pre-wrap; word-break: break-word; color: #00ff88; max-height: 300px; overflow-y: auto; }
.ai-output img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
.ai-output audio, .ai-output video { width: 100%; margin-top: 8px; border-radius: 8px; }

/* TERMINAL */
.terminal { background: #000; color: #00ff41; font-family: 'Courier New', monospace; font-size: 13px; padding: 15px; height: 100%; overflow-y: auto; }
.terminal-line { margin-bottom: 4px; }
.terminal-input-line { display: flex; align-items: center; }
.terminal-prompt { color: #00d4ff; margin-right: 8px; white-space: nowrap; }
.terminal-input { flex: 1; background: transparent; border: none; color: #00ff41; font-family: inherit; font-size: inherit; outline: none; }

/* SYSTEM MONITOR */
.monitor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.monitor-card { background: rgba(0,0,0,0.3); border-radius: 10px; padding: 15px; }
.monitor-card h4 { font-size: 12px; color: #a0a0b0; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
.monitor-value { font-size: 28px; font-weight: 700; color: #00d4ff; margin-bottom: 10px; }
.monitor-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
.monitor-bar-fill { height: 100%; background: linear-gradient(90deg, #00d4ff, #7b2cbf); transition: width 0.5s; }
.monitor-chart { width: 100%; height: 100px; background: rgba(0,0,0,0.3); border-radius: 8px; margin-top: 10px; }

/* SETTINGS */
.settings-section { margin-bottom: 25px; }
.settings-section h3 { font-size: 16px; margin-bottom: 12px; color: #00d4ff; }
.settings-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 8px; }
.settings-label { font-size: 14px; }
.settings-control select, .settings-control input { padding: 6px 10px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #fff; font-size: 13px; }

/* CALCULATOR */
.calc-display { background: rgba(0,0,0,0.5); padding: 20px; text-align: right; font-size: 32px; margin-bottom: 15px; border-radius: 8px; min-height: 80px; word-break: break-all; }
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.calc-btn { padding: 18px; background: rgba(255,255,255,0.1); border: none; border-radius: 8px; color: #fff; font-size: 18px; cursor: pointer; transition: background 0.2s; }
.calc-btn:hover { background: rgba(255,255,255,0.2); }
.calc-btn.op { background: #00d4ff; color: #000; }
.calc-btn.eq { background: #7b2cbf; grid-column: span 2; }

/* NOTES */
.notes-area { width: 100%; height: 100%; min-height: 300px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 15px; color: #fff; font-size: 14px; font-family: inherit; resize: none; outline: none; }
.notes-area:focus { border-color: #00d4ff; }

/* BROWSER */
.browser-bar { display: flex; gap: 8px; margin-bottom: 12px; }
.browser-url { flex: 1; padding: 8px 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 13px; }
.browser-btn { padding: 8px 14px; background: #00d4ff; border: none; border-radius: 8px; color: #000; font-weight: 600; cursor: pointer; }
.browser-frame { width: 100%; height: calc(100% - 50px); border: none; border-radius: 8px; background: #fff; }

/* CONTEXT MENU */
.context-menu { position: fixed; background: rgba(30,30,45,0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 6px 0; z-index: 9999; min-width: 180px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.context-item { padding: 8px 16px; color: #fff; font-size: 13px; cursor: pointer; }
.context-item:hover { background: #00d4ff; color: #000; }
.context-separator { height: 1px; background: rgba(255,255,255,0.1); margin: 4px 0; }

/* NOTIFICATIONS */
.notification { position: fixed; top: 40px; right: 20px; background: rgba(30,30,45,0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 15px 20px; color: #fff; z-index: 9998; animation: slideIn 0.3s; max-width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
@keyframes slideIn { from { transform: translateX(400px); } to { transform: translateX(0); } }

/* RESPONSIVE */
@media (max-width: 768px) {
  .window { min-width: 90vw !important; min-height: 60vh !important; }
  .dock-item { width: 48px; height: 48px; }
  .dock-icon { font-size: 24px; }
  .ai-grid { grid-template-columns: 1fr; }
  .monitor-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- BOOT SCREEN -->
<div id="boot-screen">
  <div class="boot-logo">⚡</div>
  <div class="boot-bar-container"><div class="boot-bar" id="boot-bar"></div></div>
  <div class="boot-text" id="boot-text">Initializing AuraOS Nexus...</div>
</div>

<!-- DESKTOP -->
<div id="desktop">
  <canvas class="matrix-rain" id="matrix"></canvas>
  
  <!-- MENU BAR -->
  <div id="menu-bar">
    <div class="menu-left">
      <span class="menu-item" style="font-size:16px">⚡</span>
      <span class="menu-item menu-app-name" id="active-app-name">Finder</span>
      <span class="menu-item">File</span>
      <span class="menu-item">Edit</span>
      <span class="menu-item">View</span>
      <span class="menu-item">Window</span>
      <span class="menu-item">Help</span>
    </div>
    <div class="menu-right">
      <span class="menu-icon"> 100%</span>
      <span class="menu-icon">📶</span>
      <span class="menu-icon"></span>
      <span class="menu-icon" id="clock">12:00</span>
    </div>
  </div>

  <!-- DESKTOP ICONS -->
  <div class="desktop-icons">
    <div class="desktop-icon" ondblclick="Aura.openApp('ai-studio')">
      <div class="desktop-icon-img">🧠</div>
      <div class="desktop-icon-label">AI Studio</div>
    </div>
    <div class="desktop-icon" ondblclick="Aura.openApp('finder')">
      <div class="desktop-icon-img">📁</div>
      <div class="desktop-icon-label">Finder</div>
    </div>
    <div class="desktop-icon" ondblclick="Aura.openApp('terminal')">
      <div class="desktop-icon-img">️</div>
      <div class="desktop-icon-label">Terminal</div>
    </div>
    <div class="desktop-icon" ondblclick="Aura.openApp('monitor')">
      <div class="desktop-icon-img">📊</div>
      <div class="desktop-icon-label">Monitor</div>
    </div>
  </div>

  <!-- WINDOWS CONTAINER -->
  <div id="windows-container"></div>

  <!-- DOCK -->
  <div id="dock">
    <div class="dock-item active" onclick="Aura.openApp('finder')" title="Finder">
      <div class="dock-icon">📁</div>
      <div class="dock-label">Finder</div>
    </div>
    <div class="dock-item" onclick="Aura.openApp('browser')" title="Browser">
      <div class="dock-icon">🌐</div>
      <div class="dock-label">Browser</div>
    </div>
    <div class="dock-item" onclick="Aura.openApp('ai-studio')" title="AI Studio">
      <div class="dock-icon"></div>
      <div class="dock-label">AI Studio</div>
    </div>
    <div class="dock-item" onclick="Aura.openApp('terminal')" title="Terminal">
      <div class="dock-icon">⌨️</div>
      <div class="dock-label">Terminal</div>
    </div>
    <div class="dock-item" onclick="Aura.openApp('monitor')" title="System Monitor">
      <div class="dock-icon">📊</div>
      <div class="dock-label">Monitor</div>
    </div>
    <div class="dock-item" onclick="Aura.openApp('calculator')" title="Calculator">
      <div class="dock-icon">🧮</div>
      <div class="dock-label">Calc</div>
    </div>
    <div class="dock-item" onclick="Aura.openApp('notes')" title="Notes">
      <div class="dock-icon">📝</div>
      <div class="dock-label">Notes</div>
    </div>
    <div class="dock-separator"></div>
    <div class="dock-item" onclick="Aura.openApp('settings')" title="Settings">
      <div class="dock-icon">⚙️</div>
      <div class="dock-label">Settings</div>
    </div>
    <div class="dock-item" onclick="Aura.openApp('trash')" title="Trash">
      <div class="dock-icon">🗑️</div>
      <div class="dock-label">Trash</div>
    </div>
  </div>
</div>

<script>
/* ============================================
   AURAOS NEXUS - CORE ENGINE
   ============================================ */

class AuraOS {
  constructor() {
    this.windows = new Map();
    this.zIndex = 100;
    this.activeApp = 'Finder';
    this.settings = JSON.parse(localStorage.getItem('auraos_settings') || '{}');
    this.notes = localStorage.getItem('auraos_notes') || '';
    this.boot();
  }

  /* BOOT SEQUENCE */
  async boot() {
    const bar = document.getElementById('boot-bar');
    const text = document.getElementById('boot-text');
    const stages = [
      'Loading kernel modules...',
      'Initializing neural networks...',
      'Connecting to AI cluster...',
      'Mounting file systems...',
      'Starting desktop environment...',
      'Welcome to AuraOS Nexus'
    ];
    for (let i = 0; i <= 100; i += 2) {
      bar.style.width = i + '%';
      if (i % 20 === 0) text.textContent = stages[i / 20] || stages[stages.length - 1];
      await new Promise(r => setTimeout(r, 40));
    }
    await new Promise(r => setTimeout(r, 500));
    document.getElementById('boot-screen').classList.add('fade');
    setTimeout(() => document.getElementById('boot-screen').style.display = 'none', 1000);
    this.initMatrix();
    this.startClock();
    this.startMonitor();
    this.notify(' Welcome to AuraOS Nexus', 'Supercomputer desktop initialized');
  }

  /* MATRIX RAIN EFFECT */
  initMatrix() {
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const chars = '⚡01アイウエオカキクケコ';
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);
    
    const draw = () => {
      ctx.fillStyle = 'rgba(0,0,0,0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00d4ff';
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    };
    setInterval(draw, 50);
  }

  /* CLOCK */
  startClock() {
    const update = () => {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    };
    update();
    setInterval(update, 1000);
  }

  /* NOTIFICATIONS */
  notify(title, msg) {
    const n = document.createElement('div');
    n.className = 'notification';
    n.innerHTML = `<strong>${title}</strong><br><span style="font-size:12px;color:#a0a0b0">${msg}</span>`;
    document.body.appendChild(n);
    setTimeout(() => n.remove(), 4000);
  }

  /* WINDOW MANAGER */
  openApp(appId) {
    if (this.windows.has(appId)) {
      const w = this.windows.get(appId);
      w.classList.remove('minimized');
      this.focusWindow(w);
      return;
    }
    const app = this.getAppConfig(appId);
    const win = document.createElement('div');
    win.className = 'window';
    win.id = `win-${appId}`;
    win.style.left = (100 + this.windows.size * 30) + 'px';
    win.style.top = (60 + this.windows.size * 30) + 'px';
    win.style.width = app.width || '700px';
    win.style.height = app.height || '500px';
    win.style.zIndex = ++this.zIndex;
    win.innerHTML = `
      <div class="window-header" onmousedown="Aura.dragWindow(event, '${appId}')">
        <div class="window-controls">
          <button class="window-btn btn-close" onclick="Aura.closeApp('${appId}')"></button>
          <button class="window-btn btn-min" onclick="Aura.minimizeApp('${appId}')"></button>
          <button class="window-btn btn-max" onclick="Aura.maximizeApp('${appId}')"></button>
        </div>
        <div class="window-title">${app.icon} ${app.name}</div>
      </div>
      <div class="window-body">${app.content}</div>
    `;
    document.getElementById('windows-container').appendChild(win);
    this.windows.set(appId, win);
    this.focusWindow(win);
    document.getElementById('active-app-name').textContent = app.name;
    if (app.onOpen) app.onOpen(win);
  }

  closeApp(id) {
    const w = this.windows.get(id);
    if (w) { w.remove(); this.windows.delete(id); }
  }
  minimizeApp(id) {
    const w = this.windows.get(id);
    if (w) w.classList.add('minimized');
  }
  maximizeApp(id) {
    const w = this.windows.get(id);
    if (w) w.classList.toggle('maximized');
  }
  focusWindow(win) {
    win.style.zIndex = ++this.zIndex;
  }
  dragWindow(e, id) {
    const win = this.windows.get(id);
    if (win.classList.contains('maximized')) return;
    const startX = e.clientX - win.offsetLeft;
    const startY = e.clientY - win.offsetTop;
    const move = (ev) => { win.style.left = (ev.clientX - startX) + 'px'; win.style.top = (ev.clientY - startY) + 'px'; };
    const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    this.focusWindow(win);
  }

  /* APP CONFIGS */
  getAppConfig(id) {
    const apps = {
      'finder': {
        name: 'Finder', icon: '', width: '650px', height: '450px',
        content: `
          <div style="display:flex;height:100%">
            <div style="width:180px;background:rgba(0,0,0,0.3);padding:15px;border-radius:8px;margin-right:15px">
              <div style="font-size:12px;color:#a0a0b0;margin-bottom:10px">FAVORITES</div>
              <div style="padding:8px;border-radius:6px;background:rgba(0,212,255,0.2);margin-bottom:5px">📁 Desktop</div>
              <div style="padding:8px;border-radius:6px;margin-bottom:5px"> Documents</div>
              <div style="padding:8px;border-radius:6px;margin-bottom:5px">⬇️ Downloads</div>
              <div style="padding:8px;border-radius:6px;margin-bottom:5px">️ Pictures</div>
              <div style="padding:8px;border-radius:6px">🎵 Music</div>
            </div>
            <div style="flex:1">
              <div style="font-size:18px;margin-bottom:15px">📁 Desktop</div>

      forest: 'linear-gradient(135deg, #0d3320 0%, #2d5016 100%)',
      sunset: 'linear-gradient(135deg, #ff6b6b 0%, #feca57 100%)'
    };
    document.getElementById('desktop').style.background = wallpapers[v] || wallpapers.default;
  }
  toggleMatrix(v) {
    document.getElementById('matrix').style.display = v === 'off' ? 'none' : 'block';
  }

  /* SYSTEM MONITOR */
  startMonitor() {
    const cpuHist = [];
    setInterval(() => {
      const cpu = Math.floor(Math.random() * 40) + 10;
      const ram = (Math.random() * 4 + 4).toFixed(1);
      const net = (Math.random() * 50 + 10).toFixed(1);
      if (document.getElementById('mon-cpu')) {
        document.getElementById('mon-cpu').textContent = cpu + '%';
        document.getElementById('mon-cpu-bar').style.width = cpu + '%';
        document.getElementById('mon-ram').textContent = ram + ' GB';
        document.getElementById('mon-ram-bar').style.width = (ram/16*100) + '%';
        document.getElementById('mon-net').textContent = net + ' MB/s';
        document.getElementById('mon-net-bar').style.width = (net/100*100) + '%';
        const up = document.getElementById('uptime');
        if (up) { const s = parseInt(up.dataset.s||0)+1; up.dataset.s=s; up.textContent = Math.floor(s/60)+'m '+s%60+'s'; }
        
        cpuHist.push(cpu);
        if (cpuHist.length > 50) cpuHist.shift();
        const canvas = document.getElementById('cpu-chart');
        if (canvas) {
          const ctx = canvas.getContext('2d');
          canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
          ctx.clearRect(0,0,canvas.width,canvas.height);
          ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 2; ctx.beginPath();
          cpuHist.forEach((v,i) => {
            const x = (i/50)*canvas.width;
            const y = canvas.height - (v/100)*canvas.height;
            i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
          });
          ctx.stroke();
        }
      }
    }, 1000);
  }
}

   ============================================ */
const AuraTerm = {
  history: [],
  run() {
    const input = document.getElementById('term-input');
    const body = document.getElementById('term-body');
    const cmd = input.value.trim();
    if (!cmd) return;
    this.history.push(cmd);
    const line = document.createElement('div');
    line.className = 'terminal-line';
    line.innerHTML = `<span style="color:#00d4ff">aura@nexus:~$</span> ${cmd}`;
    body.insertBefore(line, input.parentElement);
    input.value = '';
    const output = document.createElement('div');
    output.className = 'terminal-line';
    output.innerHTML = this.execute(cmd);
    body.insertBefore(output, input.parentElement);
    body.scrollTop = body.scrollHeight;
  },
  execute(cmd) {
    const parts = cmd.split(' ');
    const c = parts[0].toLowerCase();
    switch(c) {
      case 'help': return 'Available: help, ls, pwd, whoami, date, clear, echo, open [app], neofetch, ai [prompt], status, exit';
      case 'ls': return 'Desktop  Documents  Downloads  AI_Studio  Terminal  System';
      case 'pwd': return '/home/aura';
      case 'whoami': return 'aura';
      case 'date': return new Date().toString();
      case 'clear': document.getElementById('term-body').innerHTML = ''; return '';
      case 'echo': return parts.slice(1).join(' ');
      case 'open': Aura.openApp(parts[1]||'finder'); return `Opening ${parts[1]||'finder'}...`;
      case 'neofetch': return `⚡ AuraOS Nexus v4.0\nOS: AuraOS\nKernel: AuraKernel 1.0\nShell: aura-sh\nResolution: ${window.innerWidth}x${window.innerHeight}\nAI Engine: Pollinations Cluster\nUptime: Active`;
      case 'ai': Aura.openApp('ai-studio'); return 'Opening AI Studio...';
      case 'status': return '✅ All systems operational\n🧠 AI Cluster: Online\n Network: Connected\n💾 Storage: 64GB Free';
      case 'exit': Aura.closeApp('terminal'); return 'Goodbye.';
      default: return `Command not found: ${c}. Type "help" for available commands.`;
    }
  }
};

/* ============================================
   CALCULATOR MODULE
   ============================================ */
const AuraCalc = {
  expr: '',
  num(n) { this.expr += n; this.update(); },
  op(o) { this.expr += o; this.update(); },
  clear() { this.expr = ''; this.update(); },
  back() { this.expr = this.expr.slice(0,-1); this.update(); },
  eq() { try { this.expr = String(eval(this.expr)); } catch { this.expr = 'Error'; } this.update(); },
  update() { document.getElementById('calc-disp').textContent = this.expr || '0'; }
};

/* ============================================
   INIT
   ============================================ */
const Aura = new AuraOS();

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.window.maximized').forEach(w => w.classList.remove('maximized'));
  }
});

// Desktop context menu
document.getElementById('desktop').addEventListener('contextmenu', (e) => {
  e.preventDefault();
  document.querySelectorAll('.context-menu').forEach(m => m.remove());
  const menu = document.createElement('div');
  menu.className = 'context-menu';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.innerHTML = `
    <div class="context-item" onclick="Aura.openApp('ai-studio');this.parentElement.remove()"> Open AI Studio</div>
    <div class="context-item" onclick="Aura.openApp('terminal');this.parentElement.remove()">⌨️ Open Terminal</div>
    <div class="context-separator"></div>
    <div class="context-item" onclick="Aura.openApp('settings');this.parentElement.remove()">️ Settings</div>
    <div class="context-item" onclick="location.reload();this.parentElement.remove()">🔄 Refresh</div>
  `;
  document.body.appendChild(menu);
  setTimeout(() => document.addEventListener('click', () => menu.remove(), {once:true}), 0);
});
</script>
