<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraOS Fastcomputer</title>
    <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%); color: #ffffff; min-height: 100vh; padding: 20px; }
        .auraos-container { max-width: 900px; margin: 0 auto; }
        .auraos-header { text-align: center; margin-bottom: 40px; padding: 30px; background: rgba(255, 255, 255, 0.05); border-radius: 16px; backdrop-filter: blur(10px); }
        .auraos-header h1 { font-size: 2.5em; margin-bottom: 10px; background: linear-gradient(135deg, #00d4ff, #7b2cbf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tagline { color: #a0a0b0; font-size: 1.1em; }
        .skills-container { display: flex; flex-direction: column; gap: 20px; }
        .skill-card { background: rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 25px; border: 1px solid rgba(255, 255, 255, 0.1); transition: transform 0.2s, box-shadow 0.2s; }
        .skill-card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
        .skill-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .skill-header h3 { font-size: 1.4em; color: #fff; }
        .skill-status { padding: 5px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 600; background: rgba(0, 255, 136, 0.2); color: #00ff88; }
        .skill-status.processing { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
        .skill-status.error { background: rgba(255, 85, 85, 0.2); color: #ff5555; }
        .skill-description { color: #a0a0b0; margin-bottom: 20px; line-height: 1.6; }
        .skill-input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .skill-input { flex: 1; padding: 12px 16px; border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 8px; background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 1em; }
        .skill-input:focus { outline: none; border-color: #00d4ff; }
        .skill-button { padding: 12px 24px; background: linear-gradient(135deg, #00d4ff, #7b2cbf); color: #fff; border: none; border-radius: 8px; font-size: 1em; font-weight: 600; cursor: pointer; }
        .skill-button:hover { transform: translateY(-1px); box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4); }
        .skill-output { background: rgba(0, 0, 0, 0.4); border-radius: 8px; padding: 20px; min-height: 100px; font-family: 'Courier New', monospace; font-size: 0.9em; line-height: 1.6; overflow-x: auto; }
        .output-placeholder { color: #606070; font-style: italic; }
        .output-content { color: #00ff88; white-space: pre-wrap; word-break: break-word; }
        .error-message { color: #ff5555; padding: 10px; background: rgba(255, 85, 85, 0.1); border-radius: 6px; border-left: 4px solid #ff5555; }
        .auraos-footer { text-align: center; margin-top: 40px; padding: 20px; color: #606070; font-size: 0.9em; }
        @media (max-width: 600px) { .skill-input-group { flex-direction: column; } .auraos-header h1 { font-size: 1.8em; } }
    </style>
</head>
<body>
    <div class="auraos-container">
        <header class="auraos-header">
            <h1>⚡ AuraOS Fastcomputer</h1>
            <p class="tagline">Agentic Skills. Instant Results. Zero Friction.</p>
        </header>
        <div id="auraos-root" class="skills-container"></div>
        <footer class="auraos-footer">
            <p>Powered by AuraOS Core v1.0 | Fully Automated Build</p>
        </footer>
    </div>

    <script>
        /**
         * AuraOS Core v2.0 - Fully Automated Engine
         */
        class AuraOS {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                this.skills = new Map();
                // YOUR CLOUDFLARE PROXY IS PRE-CONFIGURED HERE
                this.proxyUrl = 'https://auraos-proxy.epcticwolf27.workers.dev/?url='; 
                this.init();
            }

            init() { console.log('🚀 AuraOS Core Initialized'); }

            registerSkill(id, config) {
                this.skills.set(id, config);
                this.renderSkill(id, config);
            }

            renderSkill(id, skill) {
                const skillDiv = document.createElement('div');
                skillDiv.className = 'skill-card';
                skillDiv.innerHTML = `
                    <div class="skill-header">
                        <h3>${skill.icon} ${skill.name}</h3>
                        <span class="skill-status" id="status-${id}">Ready</span>
                    </div>
                    <p class="skill-description">${skill.description}</p>
                    <div class="skill-input-group">
                        <input type="text" id="input-${id}" placeholder="${skill.placeholder || 'Enter input...'}" class="skill-input">
                        <button onclick="Aura.executeSkill('${id}')" class="skill-button">${skill.buttonText || 'Execute'}</button>
                    </div>
                    <div class="skill-output" id="output-${id}"><span class="output-placeholder">Results will appear here...</span></div>
                `;
                this.container.appendChild(skillDiv);
            }

            async executeSkill(skillId) {
                const skill = this.skills.get(skillId);
                const input = document.getElementById(`input-${skillId}`).value.trim();
                const outputDiv = document.getElementById(`output-${skillId}`);
                const statusSpan = document.getElementById(`status-${skillId}`);

                if (!input) { outputDiv.innerHTML = '<div class="error-message">⚠️ Input required</div>'; return; }

                statusSpan.textContent = 'Processing...'; statusSpan.className = 'skill-status processing';
                outputDiv.innerHTML = '<div style="color:#ffc107">⏳ Working...</div>';

                try {
                    const result = await skill.handler(input, this);
                    statusSpan.textContent = 'Success'; statusSpan.className = 'skill-status success';
                    outputDiv.innerHTML = `<pre class="output-content">${this.escapeHtml(typeof result === 'string' ? result : JSON.stringify(result, null, 2))}</pre>`;
                } catch (error) {
                    statusSpan.textContent = 'Failed'; statusSpan.className = 'skill-status error';
                    outputDiv.innerHTML = `<div class="error-message">❌ ${error.message}</div>`;
                }
            }

            async fetchWithProxy(url) {
                const fallbackProxies = [
                    `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,
                    `https://thingproxy.freeboard.io/fetch/${url}`
                ];
                try {
                    const response = await fetch(this.proxyUrl + encodeURIComponent(url));
                    if (response.ok) return await response.text();
                } catch (e) { console.log('Primary proxy failed, trying fallbacks...'); }
                
                for (const proxy of fallbackProxies) {
                    try { const response = await fetch(proxy); if (response.ok) return await response.text(); } catch (e) { continue; }
                }
                throw new Error('All proxy services unavailable.');
            }

            escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        }

        const Aura = new AuraOS('auraos-root');

        // ==========================================
        // SKILL 1: SMART RESEARCH
        // ==========================================
        Aura.registerSkill('smart-research', {
            name: 'Smart Research', icon: '🔍',
            description: 'Fetch any webpage and get clean, ad-free Markdown instantly.',
            placeholder: 'https://en.wikipedia.org/wiki/Operating_system', buttonText: 'Fetch & Clean',
            handler: async (url, os) => {
                if (!url.match(/^https?:\/\//)) url = 'https://' + url;
                const html = await os.fetchWithProxy(url);
                const cleanHtml = html.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
                                      .replace(/<style\b[^<]*(?:(?!<\/style>)<[^<]*)*<\/style>/gi, '')
                                      .replace(/<nav[^>]*>[\s\S]*?<\/nav>/gi, '').replace(/<footer[^>]*>[\s\S]*?<\/footer>/gi, '');
                const turndown = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });
                const markdown = turndown.turndown(cleanHtml);
                return markdown.length > 5000 ? markdown.substring(0, 5000) + '\n\n...[Truncated]' : markdown;
            }
        });

        // ==========================================
        // SKILL 2: AURA SNAP
        // ==========================================
        Aura.registerSkill('aura-snap', {
            name: 'Aura Snap', icon: '📸',
            description: 'Capture full-page screenshots of any website instantly.',
            placeholder: 'https://example.com', buttonText: 'Capture',
            handler: async (url, os) => {
                if (!url.match(/^https?:\/\//)) url = 'https://' + url;
                const apiUrl = `https://image.thum.io/get/fullpage/${encodeURIComponent(url)}`;
                return `**Screenshot Captured!**\n\n![Website Screenshot](${apiUrl})\n\n*Right-click or long-press image to save*`;
            }
        });
    </script>
</body>
</html>
