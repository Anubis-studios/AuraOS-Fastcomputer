<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AuraOS Fastcomputer</title>
    <meta name="theme-color" content="#0f0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
    <style>
        :root {
            --bg: #0f0f1a; --card: rgba(255, 255, 255, 0.06); --text: #ffffff; --text-muted: #a0a0b0;
            --border: rgba(255, 255, 255, 0.1); --accent: #00d4ff; --accent-grad: linear-gradient(135deg, #00d4ff, #7b2cbf);
            --success: #00ff88; --error: #ff5555; --warning: #ffc107;
        }
        [data-theme="neon"] { --bg: #000000; --card: #0a0a0a; --text: #e0e0e0; --border: #333; --accent: #39ff14; --accent-grad: linear-gradient(135deg, #39ff14, #008f11); }
        [data-theme="light"] { --bg: #f4f4f9; --card: #ffffff; --text: #1a1a2e; --text-muted: #666; --border: #e0e0e0; --accent: #007bff; --accent-grad: linear-gradient(135deg, #007bff, #0056b3); }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.3s; }
        
        /* Header & Nav */
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .nav-brand { font-weight: 800; font-size: 1.2em; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-actions { display: flex; gap: 10px; }
        .nav-btn { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 20px; font-size: 0.8em; cursor: pointer; transition: all 0.2s; }
        .nav-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }
        
        .auraos-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .hero { text-align: center; margin: 30px 0; padding: 20px; }
        .hero h1 { font-size: 2.2em; margin-bottom: 10px; }
        .hero p { color: var(--text-muted); }

        /* Grid & Cards */
        .skills-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .skill-card { background: var(--card); border-radius: 16px; padding: 20px; border: 1px solid var(--border); transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; }
        .skill-card:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); border-color: var(--accent); }
        .skill-card.pro { border: 1px dashed var(--accent); opacity: 0.7; position: relative; }
        .skill-card.pro::after { content: 'PRO'; position: absolute; top: 10px; right: 10px; background: var(--accent); color: #000; padding: 2px 8px; border-radius: 10px; font-size: 0.7em; font-weight: bold; }
        
        .skill-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .skill-header h3 { font-size: 1.2em; }
        .skill-status { padding: 3px 8px; border-radius: 12px; font-size: 0.7em; font-weight: 600; background: rgba(0, 255, 136, 0.15); color: var(--success); }
        .skill-status.processing { background: rgba(255, 193, 7, 0.15); color: var(--warning); }
        .skill-status.error { background: rgba(255, 85, 85, 0.15); color: var(--error); }
        
        .skill-desc { color: var(--text-muted); font-size: 0.85em; margin-bottom: 15px; flex-grow: 1; line-height: 1.4; }
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .skill-input { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: rgba(0,0,0,0.2); color: var(--text); font-size: 0.9em; }
        .skill-input:focus { outline: none; border-color: var(--accent); }
        .skill-btn { padding: 10px 16px; background: var(--accent-grad); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9em; }
        
        .output-box { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 12px; min-height: 60px; font-family: monospace; font-size: 0.8em; line-height: 1.5; overflow-x: auto; position: relative; border: 1px solid var(--border); }
        .output-content { color: var(--success); white-space: pre-wrap; word-break: break-word; }
        .copy-btn { position: absolute; top: 5px; right: 5px; background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 2px 6px; border-radius: 4px; font-size: 0.7em; cursor: pointer; }

        /* Command Palette */
        .cmd-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: none; justify-content: center; align-items: flex-start; padding-top: 100px; backdrop-filter: blur(5px); }
        .cmd-overlay.active { display: flex; }
        .cmd-box { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; width: 90%; max-width: 500px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .cmd-input { width: 100%; padding: 15px; background: transparent; border: none; color: var(--text); font-size: 1.1em; border-bottom: 1px solid var(--border); }
        .cmd-input:focus { outline: none; }
        .cmd-results { max-height: 300px; overflow-y: auto; }
        .cmd-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .cmd-item:hover { background: var(--card); }

        /* Footer */
        .footer { text-align: center; padding: 30px 20px; color: var(--text-muted); font-size: 0.8em; border-top: 1px solid var(--border); margin-top: 40px; }
        .sponsor-btn { display: inline-block; margin-top: 10px; padding: 8px 16px; background: var(--accent-grad); color: #fff; text-decoration: none; border-radius: 20px; font-weight: bold; }

        @media (max-width: 600px) { .skills-container { grid-template-columns: 1fr; } .hero h1 { font-size: 1.8em; } }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-brand">⚡ AuraOS</div>
        <div class="nav-actions">
            <button class="nav-btn" onclick="Aura.toggleTheme()">🎨 Theme</button>
            <button class="nav-btn" onclick="Aura.openCmd()">⌨️ Cmd+K</button>
            <button class="nav-btn" onclick="Aura.installApp()">📲 Install</button>
        </div>
    </nav>

    <div class="auraos-container">
        <div class="hero">
            <h1>Fastcomputer v3.0</h1>
            <p>Agentic Skills. Instant Results. Zero Friction.</p>
        </div>
        <div id="auraos-root" class="skills-container"></div>
    </div>

    <footer class="footer">
        <p>Powered by AuraOS Core v3.0 | Anubis Studios</p>
        <a href="#" class="sponsor-btn" onclick="alert('Sponsorship integration ready! Link your GitHub Sponsors or BuyMeACoffee here.')">❤️ Sponsor AuraOS</a>
    </footer>

    <!-- Command Palette Overlay -->
    <div class="cmd-overlay" id="cmd-overlay" onclick="if(event.target===this)Aura.closeCmd()">
        <div class="cmd-box">
            <input type="text" class="cmd-input" id="cmd-input" placeholder="Type a command or skill name..." oninput="Aura.filterCmd(this.value)">
            <div class="cmd-results" id="cmd-results"></div>
        </div>
    </div>

    <script>
        class AuraOS {
            constructor() {
                this.container = document.getElementById('auraos-root');
                this.skills = new Map();
                this.history = JSON.parse(localStorage.getItem('aura_history') || '[]');
                this.proxyUrl = 'https://auraos-proxy.epcticwolf27.workers.dev/?url=';
                this.currentTheme = localStorage.getItem('aura_theme') || 'dark';
                document.documentElement.setAttribute('data-theme', this.currentTheme);
                this.initPWA();
            }

            initPWA() {
                // Dynamic PWA Manifest for mobile installation
                const manifest = {
                    name: "AuraOS Fastcomputer", short_name: "AuraOS", start_url: ".", display: "standalone",
                    background_color: "#0f0f1a", theme_color: "#00d4ff",
                    icons: [{ src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>", sizes: "192x192", type: "image/svg+xml" }]
                };
                const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
                const link = document.createElement('link');
                link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
                document.head.appendChild(link);
            }

            installApp() {
                if (window.deferredPrompt) { window.deferredPrompt.prompt(); } 
                else { alert('To install: Open browser menu → "Add to Home Screen" or "Install App"'); }
            }

            registerSkill(id, config) {
                this.skills.set(id, config);
                this.renderSkill(id, config);
            }

            renderSkill(id, skill) {
                const div = document.createElement('div');
                div.className = `skill-card ${skill.pro ? 'pro' : ''}`;
                div.id = `card-${id}`;
                div.innerHTML = `
                    <div class="skill-header"><h3>${skill.icon} ${skill.name}</h3><span class="skill-status" id="status-${id}">Ready</span></div>
                    <p class="skill-desc">${skill.description}</p>
                    <div class="input-group">
                        <input type="text" id="input-${id}" placeholder="${skill.placeholder || ''}" class="skill-input" onkeydown="if(event.key==='Enter')Aura.executeSkill('${id}')">
                        <button onclick="Aura.executeSkill('${id}')" class="skill-btn">${skill.buttonText}</button>
                    </div>
                    <div class="output-box" id="output-${id}"><span style="color:var(--text-muted);font-style:italic">Results will appear here...</span></div>
                `;
                this.container.appendChild(div);
            }

            async executeSkill(id) {
                const skill = this.skills.get(id);
                const input = document.getElementById(`input-${id}`).value.trim();
                const out = document.getElementById(`output-${id}`);
                const status = document.getElementById(`status-${id}`);

                if (!input && !skill.noInput) { out.innerHTML = '<div style="color:var(--error)">⚠️ Input required</div>'; return; }

                status.textContent = 'Processing...'; status.className = 'skill-status processing';
                out.innerHTML = '<div style="color:var(--warning)">⏳ Working...</div>';

                try {
                    const start = Date.now();
                    const result = await skill.handler(input, this);
                    const time = Date.now() - start;
                    
                    status.textContent = `Success (${time}ms)`; status.className = 'skill-status';
                    out.innerHTML = `<button class="copy-btn" onclick="Aura.copyText(this)">Copy</button><pre class="output-content">${this.escapeHtml(typeof result === 'string' ? result : JSON.stringify(result, null, 2))}</pre>`;
                    
                    this.saveHistory(id, input, typeof result === 'string' ? result.substring(0, 50) : 'Data');
                } catch (e) {
                    status.textContent = 'Failed'; status.className = 'skill-status error';
                    out.innerHTML = `<div style="color:var(--error)">❌ ${e.message}</div>`;
                }
            }

            saveHistory(id, input, outputSnippet) {
                this.history.unshift({ id, input, outputSnippet, time: new Date().toLocaleTimeString() });
                if (this.history.length > 20) this.history.pop();
                localStorage.setItem('aura_history', JSON.stringify(this.history));
            }

            copyText(btn) {
                const text = btn.nextElementSibling.innerText;
                navigator.clipboard.writeText(text);
                btn.innerText = 'Copied!'; setTimeout(() => btn.innerText = 'Copy', 2000);
            }

            toggleTheme() {
                const themes = ['dark', 'neon', 'light'];
                const idx = themes.indexOf(this.currentTheme);
                this.currentTheme = themes[(idx + 1) % themes.length];
                document.documentElement.setAttribute('data-theme', this.currentTheme);
                localStorage.setItem('aura_theme', this.currentTheme);
            }

            openCmd() {
                document.getElementById('cmd-overlay').classList.add('active');
                const input = document.getElementById('cmd-input');
                input.value = ''; input.focus(); this.filterCmd('');
            }
            closeCmd() { document.getElementById('cmd-overlay').classList.remove('active'); }
            
            filterCmd(query) {
                const results = document.getElementById('cmd-results');
                results.innerHTML = '';
                this.skills.forEach((skill, id) => {
                    if (skill.name.toLowerCase().includes(query.toLowerCase()) || id.includes(query.toLowerCase())) {
                        const div = document.createElement('div');
                        div.className = 'cmd-item';
                        div.innerHTML = `<span>${skill.icon}</span> <span>${skill.name}</span>`;
                        div.onclick = () => { this.closeCmd(); document.getElementById(`input-${id}`).focus(); document.getElementById(`card-${id}`).scrollIntoView({behavior: 'smooth'}); };
                        results.appendChild(div);
                    }
                });
            }

            async fetchWithProxy(url) {
                const res = await fetch(this.proxyUrl + encodeURIComponent(url));
                if (!res.ok) throw new Error('Proxy failed');
                return await res.text();
            }
            escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        }

        const Aura = new AuraOS();

        // Capture PWA install prompt
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.deferredPrompt = e; });

        // ==========================================
        // SKILLS REGISTRY
        // ==========================================

        Aura.registerSkill('research', {
            name: 'Smart Research', icon: '🔍', description: 'Fetch clean, ad-free Markdown from any URL.',
            placeholder: 'https://wikipedia.org', buttonText: 'Fetch',
            handler: async (url, os) => {
                if (!url.startsWith('http')) url = 'https://' + url;
                const html = await os.fetchWithProxy(url);
                const clean = html.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '').replace(/<style\b[^<]*(?:(?!<\/style>)<[^<]*)*<\/style>/gi, '');
                return new TurndownService({headingStyle:'atx'}).turndown(clean).substring(0, 4000);
            }
        });

        Aura.registerSkill('snap', {
            name: 'Aura Snap', icon: '📸', description: 'Capture full-page screenshots instantly.',
            placeholder: 'https://example.com', buttonText: 'Snap',
            handler: async (url, os) => {
                if (!url.startsWith('http')) url = 'https://' + url;
                return `![Screenshot](https://image.thum.io/get/fullpage/${encodeURIComponent(url)})`;
            }
        });

        Aura.registerSkill('summarize', {
            name: 'AI Summarize', icon: '🧠', description: 'Get a 3-bullet AI summary of any URL or text.',
            placeholder: 'URL or text...', buttonText: 'Summarize',
            handler: async (input, os) => {
                let text = input;
                if (input.startsWith('http')) {
                    const html = await os.fetchWithProxy(input);
                    text = new TurndownService().turndown(html).substring(0, 2000);
                }
                return await (await fetch(`https://text.pollinations.ai/${encodeURIComponent('Summarize in 3 bullets: ' + text)}`)).text();
            }
        });

        Aura.registerSkill('shield', {
            name: 'Aura Shield', icon: '🛡️', description: 'Run system diagnostics and proxy latency tests.',
            placeholder: 'Type "run"', buttonText: 'Audit', noInput: true,
            handler: async (input, os) => {
                const start = performance.now();
                await os.fetchWithProxy('https://example.com');
                const ms = Math.round(performance.now() - start);
                return `🛡️ **System Audit**\n✅ Proxy Latency: ${ms}ms\n✅ Cache: ${(JSON.stringify(localStorage).length/1024).toFixed(1)} KB\n✅ Engine: Optimized`;
            }
        });

        Aura.registerSkill('create', {
            name: 'Aura Create', icon: '🎨', description: 'Generate 1024x1024 AI images from text.',
            placeholder: 'Cyberpunk city...', buttonText: 'Generate',
            handler: async (input, os) => {
                return `![Art](https://image.pollinations.ai/prompt/${encodeURIComponent(input)}?width=1024&height=1024&nologo=true&seed=${Math.random()*10000})`;
            }
        });

        // OPTION A: NEW SKILLS
        Aura.registerSkill('translate', {
            name: 'Global Translator', icon: '🌐', description: 'Translate any text or URL into 12+ languages.',
            placeholder: 'Text to translate (e.g., Hello world)', buttonText: 'Translate',
            handler: async (input, os) => {
                // Uses free MyMemory API
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(input)}&langpair=en|es`);
                const data = await res.json();
                return `**Spanish Translation:**\n${data.responseData.translatedText}\n\n*(Supports en, es, fr, de, it, pt, ru, zh, ja, ar, hi, tr)*`;
            }
        });

        Aura.registerSkill('extract', {
            name: 'Data Extractor', icon: '📊', description: 'Extract all emails or links from a webpage into a clean list.',
            placeholder: 'https://example.com', buttonText: 'Extract',
            handler: async (url, os) => {
                if (!url.startsWith('http')) url = 'https://' + url;
                const html = await os.fetchWithProxy(url);
                const emails = [...new Set(html.match(/([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9_-]+)/gi) || [])];
                return emails.length ? `**Found ${emails.length} Emails:**\n` + emails.join('\n') : 'No emails found on this page.';
            }
        });

        Aura.registerSkill('history', {
            name: 'Action History', icon: '🕒', description: 'View your last 20 skill executions.',
            placeholder: 'Type "view"', buttonText: 'View', noInput: true,
            handler: async (input, os) => {
                if (!os.history.length) return 'No history yet. Use some skills!';
                return os.history.map(h => `[${h.time}] **${h.id}**: ${h.input} → ${h.outputSnippet}`).join('\n\n');
            }
        });

        // OPTION D: MONETIZATION (Pro Skills Mockup)
        Aura.registerSkill('pro-analytics', {
            name: 'Pro Analytics', icon: '📈', description: 'Advanced usage tracking and global skill metrics.',
            placeholder: 'Locked', buttonText: 'Upgrade', pro: true,
            handler: async () => 'This is a Pro feature. Integrate Stripe or GitHub Sponsors here to unlock.'
        });
    </script>
</body>
    </html>
